<div class="login-container">
  <div class="login-card">
    <h1>Abastia</h1>
    <p>Bienvenid@, inicia sesión para continuar</p>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline">
        <mat-label for="email">Email</mat-label>
        <input
          matInput
          type="email"
          id="email"
          placeholder="Email"
          formControlName="email"
          class="form-control"/>

          <mat-error *ngIf="loginForm.get('email')?.hasError('required')">
            El email es obligatorio
          </mat-error>
          <mat-error *ngIf="loginForm.get('email')?.hasError('email')">
            Por favor, introduce un email válido
          </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label for="password">Contraseña</mat-label>
        <input 
          matInput 
          [type]="hide() ? 'password' : 'text'"
          formControlName="password"
          placeholder="Contraseña"
          class="form-control"
          />
        <button
          matIconButton
          matSuffix
          (click)="clickEvent($event)"
          [attr.aria-label]="'Hide password'"
          [attr.aria-pressed]="hide()"
        >
          <mat-icon>{{hide() ? 'visibility_off' : 'visibility'}}</mat-icon>
        </button>
        <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
          La contraseña es obligatoria
        </mat-error>
        <mat-error *ngIf="loginForm.get('password')?.hasError('invalidCredentials')">
          Correo o contraseña incorrectos
        </mat-error>

      </mat-form-field>
      <button mat-raised-button color="primary" type="submit" class="submit-btn" [disabled]="loginForm.invalid">
        Iniciar Sesión
      </button>
      <p class="register-text">
        ¿Todavía no tienes una cuenta? <a routerLink="/register">Regístrate</a>
      </p>
    </form>

    @if (errorMessage) {
      <p>{{ errorMessage}}</p>
    }
  </div>

</div>
