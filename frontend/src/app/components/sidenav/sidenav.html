  <div class="app-container" [class.is-mobile]="isMobile()">
    <mat-toolbar class="app-toolbar">
      <button matIconButton (click)="snav.toggle()"><mat-icon>menu</mat-icon></button>
      <h1 class="app-name">Abastia</h1>
    </mat-toolbar>

    <mat-sidenav-container class="sidenav-container"
                          [style.marginTop.px]="isMobile() ? 56 : 0">
      <mat-sidenav #snav [mode]="isMobile() ? 'over' : 'side'"
                  [fixedInViewport]="isMobile()" fixedTopGap="56">
        <mat-nav-list>
          <a 
            mat-list-item
            routerLink="/home"
            routerLinkActive="active-link"
            (click)="isMobile() ? snav.close() : null"
          >
            <mat-icon matListItemIcon>home</mat-icon>
            <span matListItemTitle>Mi despensa</span>
          </a>
          <a 
            mat-list-item
            routerLink="/productos"
            routerLinkActive="active-link"
            (click)="isMobile() ? snav.close() : null"
          >
            <mat-icon matListItemIcon>inventory_2</mat-icon>
            <span matListItemTitle>Mis productos</span>
          </a>
          <a 
            mat-list-item
            routerLink="/listaCompra"
            routerLinkActive="active-link"
            (click)="isMobile() ? snav.close() : null"
          >
            <mat-icon matListItemIcon>shopping_cart</mat-icon>
            <span matListItemTitle>Lista de la compra</span>
          </a>
          <a 
            mat-list-item
            routerLink="/profile"
            routerLinkActive="active-link"
            (click)="isMobile() ? snav.close() : null"
          >
            <mat-icon matListItemIcon>person</mat-icon>
            <span matListItemTitle>Perfil</span>
          </a>
        </mat-nav-list>

        <div class="sidenav-footer">
          <button
            mat-button
            type="button"
            class="logout-button"
            (click)="logout()"
          >
            <mat-icon>logout</mat-icon>
            Cerrar sesión
          </button>
        </div>
       </mat-sidenav>
      <mat-sidenav-content>
        <main class="page-content">
          <router-outlet></router-outlet>
        </main>
      </mat-sidenav-content>
    </mat-sidenav-container>

  </div>
